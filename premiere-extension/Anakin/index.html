<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Anakin</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0e12; color: #eceef3; font: 14px -apple-system, Segoe UI, sans-serif; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  #offline { display: none; height: 100%; align-items: center; justify-content: center; flex-direction: column; gap: 14px; text-align: center; padding: 24px; box-sizing: border-box; }
  #offline b { font-size: 18px; }
  #offline p { color: #8c93a3; max-width: 420px; line-height: 1.5; margin: 0; }
  button { background: #ff3d5a; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<div id="offline">
  <b>O Anakin não está aberto</b>
  <p>Abra o aplicativo Anakin no seu computador (arquivo “Abrir Anakin”) e depois clique em Tentar de novo.</p>
  <button id="retry">Tentar de novo</button>
</div>
<iframe id="app" title="Anakin"></iframe>
<script>
  // Painel do Premiere: mostra o Anakin (servidor local) e faz a ponte com a timeline via ExtendScript.
  var URL_APP = "http://localhost:3001/?premiere=1";
  var frame = document.getElementById("app");
  var offline = document.getElementById("offline");

  function evalScript(code, cb) {
    if (window.__adobe_cep__) window.__adobe_cep__.evalScript(code, cb);
    else cb('{"error":"Abra este painel dentro do Premiere Pro."}');
  }
  function parse(txt) { try { return JSON.parse(txt); } catch (e) { return { error: String(txt || e) }; } }
  function reply(msg) { frame.contentWindow && frame.contentWindow.postMessage(msg, "*"); }

  window.addEventListener("message", function (e) {
    var d = e.data;
    if (!d || typeof d.type !== "string") return;
    if (d.type === "anakin:getSequence") {
      evalScript("anakin_getSequence()", function (res) {
        var r = parse(res);
        reply({ type: "anakin:sequence", seq: r.seq || null, error: r.error });
      });
    } else if (d.type === "anakin:place") {
      var call = "anakin_place(" + JSON.stringify(String(d.path)) + "," + Number(d.at || 0) + "," + Number(d.track || 2) + ")";
      evalScript(call, function (res) {
        var r = parse(res);
        reply({ type: "anakin:placed", ok: !!r.ok, error: r.error });
      });
    }
  });

  function load() {
    fetch("http://localhost:3001/api/library", { cache: "no-store" })
      .then(function () { offline.style.display = "none"; frame.style.display = "block"; frame.src = URL_APP; })
      .catch(function () { frame.style.display = "none"; offline.style.display = "flex"; });
  }
  document.getElementById("retry").onclick = load;
  load();
</script>
</body>
</html>
